# Static files of the browser version. The page only uses relative URLs, so it also works
# behind a reverse proxy that serves it under a path (for example /entombed/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_min_length 1024;

    # File names are not versioned: always revalidate (ETag), so a new image is seen at once.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
